[project]
name = "pol_crm"
version = "0.1.0"
description = "POL CRM: RFM Segmentation, Loyalty Rewards, and Marketing Automation for Frappe & ERPNext"
authors = [
    { name = "POL CRM Team", email = "info@polcrm.ir" }
]
dependencies = [
    "requests>=2.28.0"
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench]
creator = "frappe"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pol_crm/tests"]
